<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка заявки на заселение</title>
    <!-- Подключаю CSS-файл -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h2>Заявка на комнатy</h2>
        
        <form id="dormForm">
            <div class="form-group">
                <label for="studentId">ID студента</label>
                <input type="number" id="studentId" required placeholder="Например: 12">
            </div>

            <div class="form-group">
                <label for="buildingNum">Номер корпуса</label>
                <input type="number" id="buildingNum" required placeholder="Например: 3">
            </div>

            <div class="form-group">
                <label for="roomNum">Номер комнаты</label>
                <input type="number" id="roomNum" required placeholder="Например: 405">
            </div>

            <button type="submit">Проверить</button>
        </form>

        <!-- Блок для вывода результата проверки -->
        <div id="statusMessage" class="status"></div>
    </div>

    <!-- Подключаем JS-файл -->
    <script src="script.js"></script>
</body>
</html>
